<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seantinel</title>
  <link rel="icon" type="image/png" href="/icon.png" />
  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; color: #eef4fa; font-family: 'Georgia', 'Times New Roman', serif; }
    body {
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(10,25,45,0.55) 0%, rgba(10,25,45,0.75) 100%),
        url('/mockup_bg.jpeg') center/cover no-repeat fixed,
        #0a1a2e;
      display: flex; flex-direction: column;
    }
    header.top {
      display: flex; align-items: center; justify-content: center;
      padding: 28px 24px 12px;
    }
    header.top img.wordmark { height: 72px; width: auto; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr minmax(320px, 440px) minmax(260px, 340px) 1fr;
      gap: 24px;
      padding: 24px 32px 48px;
      align-items: start;
    }
    .center-card {
      grid-column: 2;
      background: rgba(10, 20, 36, 0.78);
      border: 1px solid rgba(220, 200, 90, 0.35);
      border-radius: 6px;
      padding: 22px 22px 18px;
      backdrop-filter: blur(6px);
    }
    .center-card h2 {
      margin: 0 0 16px 0; font-size: 22px; font-weight: 500;
      letter-spacing: 2px; text-transform: uppercase; color: #f0e4a8;
      text-align: center;
    }
    .city-list { display: flex; flex-direction: column; gap: 10px; }
    .city {
      display: block; padding: 14px 18px;
      background: rgba(18, 32, 52, 0.75);
      border: 1px solid rgba(160, 190, 220, 0.3);
      border-radius: 4px;
      text-decoration: none; color: #eef4fa;
      transition: border-color 0.15s, background 0.15s, transform 0.15s;
      font-size: 17px; letter-spacing: 0.5px;
    }
    .city:hover { border-color: #f0e4a8; background: rgba(32, 50, 76, 0.9); transform: translateX(4px); }
    .city .sub { display: block; margin-top: 2px; font-size: 12px; color: #9fc6e8; letter-spacing: 0.3px; }
    .right-col { grid-column: 3; display: flex; flex-direction: column; gap: 18px; }
    .qr-tile {
      background: rgba(10, 20, 36, 0.78);
      border: 2px dashed rgba(240, 228, 168, 0.55);
      border-radius: 6px;
      padding: 28px 20px;
      text-align: center;
      backdrop-filter: blur(6px);
    }
    .qr-tile .qr-glyph {
      display: inline-block; width: 110px; height: 110px;
      margin: 10px auto 14px;
      background:
        linear-gradient(90deg, #f0e4a8 0 20%, transparent 20% 40%, #f0e4a8 40% 60%, transparent 60% 80%, #f0e4a8 80% 100%),
        linear-gradient(0deg, #f0e4a8 0 20%, transparent 20% 40%, #f0e4a8 40% 60%, transparent 60% 80%, #f0e4a8 80% 100%);
      background-size: 100% 20%, 20% 100%;
      background-repeat: repeat-x, repeat-y;
      background-color: rgba(0,0,0,0.3);
      opacity: 0.35;
      border: 1px solid rgba(240, 228, 168, 0.4);
    }
    .qr-tile .label { font-size: 18px; letter-spacing: 1px; color: #f0e4a8; margin: 0 0 6px 0; }
    .qr-tile .sub { font-size: 13px; color: #cfe8ff; margin: 0; }
    .involved-tile {
      display: block; text-align: center;
      background: rgba(18, 32, 52, 0.75);
      border: 1px solid rgba(160, 190, 220, 0.3);
      border-radius: 4px;
      padding: 16px 18px;
      color: #eef4fa; text-decoration: none;
      font-size: 15px; letter-spacing: 0.5px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .involved-tile:hover { border-color: #f0e4a8; background: rgba(32, 50, 76, 0.9); }
    .lang-toggle {
      position: fixed; top: 14px; right: 16px;
      background: rgba(0, 0, 0, 0.5); color: #cfe8ff;
      border: 1px solid rgba(140, 180, 220, 0.4); border-radius: 6px;
      padding: 6px 10px; font-size: 12px; letter-spacing: 1px;
      cursor: pointer; font-family: inherit;
    }
    .lang-toggle:hover { background: rgba(0, 0, 0, 0.75); border-color: #78b4e0; color: #fff; }
    footer {
      padding: 18px 20px 28px; text-align: center;
      color: #cfe0f0; font-size: 12px; line-height: 1.6;
      background: rgba(0,0,0,0.35);
    }
    footer a { color: #f0e4a8; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    @media (max-width: 760px) {
      main {
        grid-template-columns: 1fr;
        padding: 16px;
      }
      .center-card, .right-col { grid-column: 1; }
      header.top img.wordmark { height: 56px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <img class="wordmark" src="/wordmark.png" alt="Seantinel" />
  </header>
  <main>
    <section class="center-card">
      <h2 data-i18n="index.find_city"></h2>
      <nav class="city-list">
        <a class="city" href="site.html?loc=hermosa">
          Hermosa Beach
          <span class="sub" data-i18n="loc.california"></span>
        </a>
        <a class="city" href="site.html?loc=redondo">
          Redondo Beach
          <span class="sub" data-i18n="loc.california"></span>
        </a>
        <a class="city" href="site.html?loc=manhattan">
          Manhattan Beach Pier
          <span class="sub" data-i18n="loc.california"></span>
        </a>
        <a class="city" href="site.html?loc=mardelplata">
          Mar del Plata
          <span class="sub" data-i18n="loc.buenosaires"></span>
        </a>
      </nav>
    </section>
    <aside class="right-col">
      <div class="qr-tile">
        <div class="qr-glyph" aria-hidden="true"></div>
        <p class="label" data-i18n="index.scan_qr"></p>
        <p class="sub" data-i18n="index.scan_qr_sub"></p>
      </div>
      <a class="involved-tile" href="mailto:seantinel.org@gmail.com" data-i18n="index.involved"></a>
    </aside>
  </main>
  <footer>
    <div data-i18n="credit.by"></div>
    <div><span data-i18n="credit.contact"></span>: <a href="mailto:seantinel.org@gmail.com">seantinel.org@gmail.com</a></div>
  </footer>
  <script type="module">
    import { applyI18n, mountLangToggle } from '/src/i18n.js';
    applyI18n();
    mountLangToggle(document.body);
  </script>
</body>
</html>
