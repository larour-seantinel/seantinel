<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seantinel · /dev</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #111; color: #ddd; font-family: sans-serif; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.65); padding: 8px 12px; border-radius: 4px; font-size: 13px; max-width: 44vw; }
    #hud h1 { margin: 0 0 6px 0; font-size: 15px; }
    #hud button { font-size: 12px; padding: 4px 8px; margin: 2px 4px 2px 0; }
    #hud select { font-size: 12px; }
    #snap-meta { font-family: monospace; font-size: 11px; color: #9cf; margin-top: 4px; }
    #cbar { position: fixed; bottom: 20px; left: 20px; width: 260px; }
    #cbar canvas { width: 100%; height: 14px; display: block; border: 1px solid #444; }
    #cbar .labels { display: flex; justify-content: space-between; font-size: 11px; margin-top: 2px; }
    #cam-readout { margin-top: 6px; font-family: monospace; font-size: 11px; color: #9cf; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud">
    <h1>Seantinel · /dev viewer</h1>
    <div id="status">loading…</div>
    <div style="margin-top:6px;">
      <label>Snapshot:
        <select id="snap-select"><option>(none)</option></select>
      </label>
      <button onclick="window.__dev.refresh()">Refresh</button>
      <label style="margin-left:6px;">
        <input type="checkbox" id="auto-refresh" />
        auto
      </label>
    </div>
    <div style="margin-top:4px;">
      <label>Z-exag:
        <input type="range" id="zexag-range" min="0" max="3" value="0" step="0.05" style="vertical-align:middle; width:140px;" />
        <span id="zexag-label" style="font-family:monospace; font-size:11px;">×1</span>
      </label>
    </div>
    <div id="snap-meta">—</div>
    <div id="cam-readout">cam · —</div>
  </div>
  <div id="cbar" style="display:none;">
    <div id="cbar-title" style="font-size:11px; margin-bottom:2px;">field</div>
    <canvas id="cbar-canvas" width="260" height="14"></canvas>
    <div class="labels"><span id="cmin">min</span><span id="cmax">max</span></div>
  </div>
  <script type="module" src="/src/dev.js"></script>
</body>
</html>
