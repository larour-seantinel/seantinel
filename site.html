<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seantinel</title>
  <link rel="icon" type="image/png" href="/icon.png" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #111; color: #ddd; font-family: sans-serif; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    a.home { position: fixed; top: 10px; left: 10px; z-index: 2; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); border: 1px solid #2a3038; border-radius: 50%; color: #cfe8ff; text-decoration: none; }
    a.home svg { width: 20px; height: 20px; display: block; }
    a.home:hover { border-color: #4a90c9; color: #fff; }
    #hud { position: fixed; top: 10px; left: 62px; background: rgba(0,0,0,0.65); padding: 8px 12px; border-radius: 4px; font-size: 13px; max-width: 44vw; }
    #hud h1 { margin: 0 0 6px 0; font-size: 15px; }
    #water-panel { position: fixed; right: 18px; bottom: 18px; background: rgba(0,0,0,0.65); padding: 12px 10px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; width: 150px; box-sizing: border-box; }
    #water-panel .title { color: #9cf; font-size: 11px; text-align: center; line-height: 1.3; }
    #water-range {
      writing-mode: vertical-lr; direction: rtl;
      width: 26px; height: 130px;
      -webkit-appearance: none; appearance: none;
      background: transparent;
    }
    #water-range::-webkit-slider-runnable-track {
      width: 12px; background: #ffd54a; border-radius: 3px;
    }
    #water-range::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 24px; height: 12px; border-radius: 2px;
      background: #9cf; border: 1px solid #1a1f26;
      margin-left: -6px;
    }
    #water-range::-moz-range-track {
      width: 12px; background: #ffd54a; border-radius: 3px;
    }
    #water-range::-moz-range-thumb {
      width: 24px; height: 12px; border-radius: 2px;
      background: #9cf; border: 1px solid #1a1f26;
    }
    #water-label { font-family: monospace; font-size: 13px; color: #9cf; min-width: 48px; text-align: center; }
    #water-context { font-size: 11px; color: #cde; text-align: center; max-width: 120px; line-height: 1.3; min-height: 2.6em; }
    #info-strip {
      position: fixed; left: 10px; bottom: 10px; z-index: 2;
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .info-teaser {
      background: rgba(0,0,0,0.6);
      border-radius: 4px;
      padding: 5px 9px; font-size: 11px; line-height: 1.3;
      cursor: pointer; white-space: nowrap;
    }
    #disclaimer-teaser {
      color: #ffb77a;
      border: 1px solid rgba(255,183,122,0.35);
    }
    #disclaimer-teaser:hover { color: #ffd0a0; border-color: #ffb77a; background: rgba(0,0,0,0.75); }
    #data-teaser {
      color: #9fbcd4;
      border: 1px solid rgba(159,188,212,0.35);
    }
    #data-teaser:hover { color: #cfe8ff; border-color: #9fbcd4; background: rgba(0,0,0,0.75); }
    .info-modal {
      position: fixed; inset: 0; z-index: 10;
      background: rgba(0,0,0,0.72);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .info-modal[hidden] { display: none; }
    .info-card {
      background: #1a1f26; color: #cfe8ff;
      max-width: 640px; max-height: 85vh; overflow-y: auto;
      padding: 20px 24px 20px 24px; border-radius: 8px;
      border: 1px solid #2a3038; position: relative;
      font-size: 13px; line-height: 1.55;
    }
    .info-card h2 { margin: 0 0 12px 0; font-size: 16px; color: #ffd54a; }
    .info-card h3 { margin: 14px 0 6px 0; font-size: 13px; color: #9cf; font-weight: normal; text-transform: uppercase; letter-spacing: 1px; }
    .info-card p { margin: 0 0 10px 0; }
    .info-card ul { margin: 0 0 8px 0; padding-left: 18px; }
    .info-card li { margin-bottom: 4px; }
    .info-card b { color: #e8f4ff; }
    .info-card a { color: #9cf; text-decoration: none; }
    .info-card a:hover { color: #fff; text-decoration: underline; }
    .info-close {
      position: absolute; top: 6px; right: 10px;
      background: none; border: none; color: #cfe8ff;
      font-size: 24px; cursor: pointer; line-height: 1; padding: 0 4px;
    }
    .info-close:hover { color: #fff; }
    .lang-toggle {
      position: fixed; top: 14px; right: 16px; z-index: 3;
      background: rgba(0, 0, 0, 0.55); color: #cfe8ff;
      border: 1px solid rgba(140, 180, 220, 0.4); border-radius: 6px;
      padding: 6px 10px; font-size: 12px; letter-spacing: 1px;
      cursor: pointer; font-family: inherit;
    }
    .lang-toggle:hover { background: rgba(0, 0, 0, 0.75); border-color: #78b4e0; color: #fff; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <a class="home" href="/" title="Home" aria-label="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11l9-8 9 8" />
      <path d="M5 10v10h14V10" />
      <path d="M10 20v-6h4v6" />
    </svg>
  </a>
  <div id="hud">
    <h1 id="site-title">Seantinel</h1>
    <div id="status">loading…</div>
  </div>
  <div id="water-panel">
    <div class="title" data-i18n-html="site.slider_title">Sea-level<br/>rise</div>
    <input type="range" id="water-range" min="0" max="10" value="0" step="0.1" disabled />
    <div id="water-label">—</div>
    <div id="water-context">&nbsp;</div>
  </div>
  <div id="info-strip">
    <div id="disclaimer-teaser" class="info-teaser" role="button" tabindex="0" data-i18n="disclaimer.teaser"></div>
    <div id="data-teaser" class="info-teaser" role="button" tabindex="0" data-i18n="data.teaser"></div>
  </div>
  <div id="disclaimer-modal" class="info-modal" hidden>
    <div class="info-card">
      <button class="info-close" aria-label="Close">&times;</button>
      <h2 data-i18n="disclaimer.title">Disclaimer</h2>
      <p data-i18n-html="disclaimer.p1"></p>
      <p data-i18n-html="disclaimer.p2"></p>
      <p data-i18n-html="disclaimer.p3"></p>
    </div>
  </div>
  <div id="data-modal" class="info-modal" hidden>
    <div class="info-card">
      <button class="info-close" aria-label="Close">&times;</button>
      <h2 data-i18n="data.title">Data sources & credits</h2>
      <h3 data-i18n="data.sources_header">Data sources</h3>
      <ul>
        <li data-i18n="data.elev"></li>
        <li data-i18n="data.imagery"></li>
        <li data-i18n="data.buildings"></li>
        <li data-i18n="data.rendering"></li>
      </ul>
      <h3 data-i18n="data.credits_header">Credits</h3>
      <p data-i18n="credit.by"></p>
      <p><span data-i18n="credit.contact">Contact</span>: <a href="mailto:seantinel.org@gmail.com">seantinel.org@gmail.com</a></p>
    </div>
  </div>
  <script type="module" src="/src/site.js"></script>
</body>
</html>
