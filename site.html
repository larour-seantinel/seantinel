<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seantinel</title>
  <link rel="icon" type="image/png" href="/icon.png" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #111; color: #ddd; font-family: sans-serif; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    a.home { position: fixed; top: 10px; left: 10px; z-index: 2; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); border: 1px solid #2a3038; border-radius: 50%; color: #cfe8ff; text-decoration: none; }
    a.home svg { width: 20px; height: 20px; display: block; }
    a.home:hover { border-color: #4a90c9; color: #fff; }
    #hud { position: fixed; top: 10px; left: 62px; background: rgba(0,0,0,0.65); padding: 8px 12px; border-radius: 4px; font-size: 13px; max-width: 44vw; }
    #hud h1 { margin: 0 0 6px 0; font-size: 15px; }
    #water-panel { position: fixed; right: 18px; bottom: 18px; background: rgba(0,0,0,0.65); padding: 12px 10px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; width: 150px; box-sizing: border-box; }
    #water-panel .title { color: #9cf; font-size: 11px; text-align: center; line-height: 1.3; }
    #water-range {
      writing-mode: vertical-lr; direction: rtl;
      width: 26px; height: 130px;
      -webkit-appearance: none; appearance: none;
      background: transparent;
    }
    #water-range::-webkit-slider-runnable-track {
      width: 12px; background: #ffd54a; border-radius: 3px;
    }
    #water-range::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 24px; height: 12px; border-radius: 2px;
      background: #9cf; border: 1px solid #1a1f26;
      margin-left: -6px;
    }
    #water-range::-moz-range-track {
      width: 12px; background: #ffd54a; border-radius: 3px;
    }
    #water-range::-moz-range-thumb {
      width: 24px; height: 12px; border-radius: 2px;
      background: #9cf; border: 1px solid #1a1f26;
    }
    #water-label { font-family: monospace; font-size: 13px; color: #9cf; min-width: 48px; text-align: center; }
    #water-context { font-size: 11px; color: #cde; text-align: center; max-width: 120px; line-height: 1.3; min-height: 2.6em; }
    #credit { position: fixed; left: 10px; bottom: 10px; font-size: 11px; color: #7a8a99; line-height: 1.5; }
    #credit a { color: inherit; text-decoration: none; }
    #credit a:hover { color: #cfe8ff; }
    #credit .line2 { color: #8aa; }
    .lang-toggle {
      position: fixed; top: 14px; right: 16px; z-index: 3;
      background: rgba(0, 0, 0, 0.55); color: #cfe8ff;
      border: 1px solid rgba(140, 180, 220, 0.4); border-radius: 6px;
      padding: 6px 10px; font-size: 12px; letter-spacing: 1px;
      cursor: pointer; font-family: inherit;
    }
    .lang-toggle:hover { background: rgba(0, 0, 0, 0.75); border-color: #78b4e0; color: #fff; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <a class="home" href="/" title="Home" aria-label="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11l9-8 9 8" />
      <path d="M5 10v10h14V10" />
      <path d="M10 20v-6h4v6" />
    </svg>
  </a>
  <div id="hud">
    <h1 id="site-title">Seantinel</h1>
    <div id="status">loading…</div>
  </div>
  <div id="water-panel">
    <div class="title" data-i18n-html="site.slider_title">Sea-level<br/>rise</div>
    <input type="range" id="water-range" min="0" max="10" value="0" step="0.1" disabled />
    <div id="water-label">—</div>
    <div id="water-context">&nbsp;</div>
  </div>
  <div id="credit">
    <div data-i18n="site.credit">Elevation: USGS 3DEP · Imagery: USGS NAIP</div>
    <div class="line2"><span data-i18n="credit.by"></span> · <a href="mailto:seantinel.org@gmail.com">seantinel.org@gmail.com</a></div>
  </div>
  <script type="module" src="/src/site.js"></script>
</body>
</html>
