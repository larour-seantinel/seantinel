<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seantinel · Hermosa Beach</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #111; color: #ddd; font-family: sans-serif; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.65); padding: 8px 12px; border-radius: 4px; font-size: 13px; max-width: 44vw; }
    #hud h1 { margin: 0 0 6px 0; font-size: 15px; }
    /* Vertical sea-level slider pinned to the right edge. writing-mode gives
       a cross-browser vertical range; direction: rtl flips it so 0 is at the
       bottom and the max is at the top. */
    #water-panel { position: fixed; right: 18px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.65); padding: 14px 10px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 12px; }
    #water-panel .title { color: #9cf; font-size: 11px; text-align: center; line-height: 1.3; }
    #water-range { writing-mode: vertical-lr; direction: rtl; width: 28px; height: 260px; }
    #water-label { font-family: monospace; font-size: 13px; color: #9cf; min-width: 48px; text-align: center; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud">
    <h1>Hermosa Beach · sea level</h1>
    <div id="status">loading…</div>
  </div>
  <div id="water-panel">
    <div class="title">Sea-level<br/>rise</div>
    <input type="range" id="water-range" min="0" max="10" value="0" step="0.1" disabled />
    <div id="water-label">—</div>
  </div>
  <script type="module" src="/src/hermosa.js"></script>
</body>
</html>
